name: Java 21 isolated logic tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile isolated Java logic
        run: |
          mkdir -p build/test-classes
          javac -encoding UTF-8 -d build/test-classes \
            src/main/java/tw/h39/compat/H39PulseSchedule.java \
            src/main/java/tw/h39/compat/H39AmmoCounter.java \
            src/main/java/tw/h39/compat/H39AmmoState.java \
            src/main/java/tw/h39/compat/H39ReloadPlan.java \
            src/main/java/tw/h39/compat/H39ReloadTiming.java \
            src/test/java/tw/h39/compat/H39PulseScheduleTest.java \
            src/test/java/tw/h39/compat/H39AmmoCounterTest.java \
            src/test/java/tw/h39/compat/H39AmmoStateTest.java \
            src/test/java/tw/h39/compat/H39ReloadPlanTest.java \
            src/test/java/tw/h39/compat/H39ReloadTimingTest.java
      - name: Verify pulse schedule
        run: java -cp build/test-classes tw.h39.compat.H39PulseScheduleTest
      - name: Verify simplified shared ammunition
        run: java -cp build/test-classes tw.h39.compat.H39AmmoCounterTest
      - name: Verify shared ammo persistence and visible tubes
        run: java -cp build/test-classes tw.h39.compat.H39AmmoStateTest
      - name: Verify physical five-shot tube reload planning
        run: java -cp build/test-classes tw.h39.compat.H39ReloadPlanTest
      - name: Verify timed server-authoritative medical tube reload
        run: java -cp build/test-classes tw.h39.compat.H39ReloadTimingTest
