name: TaCZ gunpack prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify H-39 gun and recipe data
        run: python tools/test_h39_gun_data.py
